{% extends 'base.html' %}
{% block content %}
<div class="page-container">
  <div class="page-header"><h2>Gaji Karyawan</h2><p>Data penggajian dan kompensasi karyawan</p></div>
  <div class="toolbar">
    <div class="search-box"><i class="fas fa-search"></i><input id="searchInput" type="text" placeholder="Cari gaji..." /></div>
    <select id="statusFilter"><option value="">Semua Status</option><option value="draft">Draft</option><option value="calculated">Calculated</option><option value="approved">Approved</option><option value="paid">Paid</option></select>
    <select id="monthFilter">
      <option value="">Semua Bulan</option><option value="1">Jan</option><option value="2">Feb</option><option value="3">Mar</option><option value="4">Apr</option><option value="5">Mei</option><option value="6">Jun</option>
      <option value="7">Jul</option><option value="8">Agu</option><option value="9">Sep</option><option value="10">Okt</option><option value="11">Nov</option><option value="12">Des</option>
    </select>
  </div>
  <div class="data-card">
    <div class="card-header d-flex justify-content-between align-items-center">
      <h5 class="m-0">Daftar Gaji</h5>
      <div><span id="totalCount" class="badge bg-primary">0</span> gaji</div>
    </div>
    <div class="table-responsive"><table class="table"><thead><tr><th>Karyawan</th><th>Periode</th><th>Gaji Pokok</th><th>Tunjangan</th><th>Potongan</th><th>Gaji Bersih</th><th>Status</th></tr></thead><tbody id="tableBody"><tr><td colspan="7" class="text-center text-muted">Memuat data...</td></tr></tbody></table></div>
  </div>
</div>
{% endblock %}
{% block extra_css %}
<style>
.page-container{padding:24px 0 40px;}
.page-header h2{color:#27ae60;font-weight:800;}
.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:14px 0;}
.search-box{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid #27ae60;border-radius:14px;padding:10px 14px;min-width:280px;flex:1;}
.search-box input{border:none;outline:none;flex:1;font-size:14px;}
.toolbar select{background:#fff;border:2px solid #27ae60;border-radius:14px;padding:10px 12px;min-width:200px;outline:none;}
.data-card{background:#fff;border:2px solid #27ae60;border-radius:18px;box-shadow:0 10px 28px rgba(39,174,96,.15);overflow:hidden;}
.data-card .card-header{background:linear-gradient(135deg,rgba(39,174,96,.05),transparent);border-bottom:2px solid #27ae60;padding:16px 18px;}
.table thead th{background:#27ae60;color:#fff;font-weight:700;padding:12px 15px;}
.table tbody td{vertical-align:middle;padding:10px 15px;}
.table tbody tr:hover{background:rgba(39,174,96,.05);}
</style>
{% endblock %}
{% block extra_js %}
<script>
(function(){
  const tbody=document.getElementById('tableBody'),search=document.getElementById('searchInput'),statusF=document.getElementById('statusFilter'),monthF=document.getElementById('monthFilter'),count=document.getElementById('totalCount');
  async function load(){
    tbody.innerHTML='<tr><td colspan="7" class="text-center text-muted">Memuat data...</td></tr>';
    try{
      const params=new URLSearchParams();
      if(search.value.trim()) params.set('search',search.value.trim());
      if(statusF.value) params.set('status',statusF.value);
      if(monthF.value) params.set('period_month',monthF.value);
      const qs=params.toString();
      const res=await fetch('/api/hr/salaries/'+(qs?'?'+qs:''),{credentials:'include'});
      if(!res.ok) throw new Error(res.status);
      const data=await res.json();
      const items=data.results||data;
      count.textContent=items.length;
      if(!items.length){tbody.innerHTML='<tr><td colspan="7" class="text-center text-muted">Tidak ada data</td></tr>';return;}
      tbody.innerHTML=items.map(s=>`<tr><td>${s.employee_name||s.employee||'-'}</td><td>${s.period_month||'-'}/${s.period_year||'-'}</td><td>Rp ${(s.basic_salary||0).toLocaleString('id')}</td><td>Rp ${(s.allowances||0).toLocaleString('id')}</td><td>Rp ${((s.deductions||0)+(s.tax||0)+(s.bpjs||0)).toLocaleString('id')}</td><td><strong>Rp ${(s.net_salary||0).toLocaleString('id')}</strong></td><td><span class="badge ${s.status==='paid'?'bg-success':s.status==='approved'?'bg-info':s.status==='calculated'?'bg-primary':'bg-secondary'}">${s.status||'-'}</span></td></tr>`).join('');
    }catch(e){console.error(e);tbody.innerHTML='<tr><td colspan="7" class="text-center text-danger">Gagal memuat data</td></tr>';}
  }
  search.addEventListener('input',()=>{clearTimeout(window.__t);window.__t=setTimeout(load,300);});
  statusF.addEventListener('change',load);
  monthF.addEventListener('change',load);
  load();
})();
</script>
{% endblock %}
