{% extends 'base.html' %}

{% block title %}Projects - SIMAN{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="row mb-4">
        <div class="col-md-8">
            <h1 class="h2">Projects</h1>
        </div>
        <div class="col-md-4 text-end">
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#createProjectModal">
                <i class="bi bi-plus-circle"></i> New Project
            </button>
        </div>
    </div>

    <!-- Projects Table -->
    <div class="card">
        <div class="card-header">
            <h5 class="card-title mb-0">Project List</h5>
        </div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover" id="projectsTable">
                    <thead>
                        <tr>
                            <th>Project Name</th>
                            <th>Category</th>
                            <th>Status</th>
                            <th>Priority</th>
                            <th>Leader</th>
                            <th>Start Date</th>
                            <th>Due Date</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="projectsTableBody">
                        <tr>
                            <td colspan="8" class="text-center text-muted">Loading...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Create/Edit Project Modal -->
<div class="modal fade" id="createProjectModal" tabindex="-1" aria-labelledby="createProjectModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="createProjectModalLabel">New Project</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="projectForm">
                    <div class="mb-3">
                        <label for="projectName" class="form-label">Project Name</label>
                        <input type="text" class="form-control" id="projectName" name="name" required>
                    </div>
                    <div class="mb-3">
                        <label for="projectCategory" class="form-label">Category</label>
                        <select class="form-control" id="projectCategory" name="category_id" required>
                            <option value="">Select Category</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="projectStatus" class="form-label">Status</label>
                        <select class="form-control" id="projectStatus" name="status" required>
                            <option value="">Select Status</option>
                            <option value="planning">Planning</option>
                            <option value="in_progress">In Progress</option>
                            <option value="on_hold">On Hold</option>
                            <option value="completed">Completed</option>
                            <option value="cancelled">Cancelled</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="projectDescription" class="form-label">Description</label>
                        <textarea class="form-control" id="projectDescription" name="description" rows="3"></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" id="saveProjectBtn">Save Project</button>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    loadProjects();
    
    // Save project button
    document.getElementById('saveProjectBtn').addEventListener('click', function() {
        saveProject();
    });
});

function loadProjects() {
    // Fetch projects from API
    fetch('/api/projects/', {
        headers: {
            'Authorization': 'Bearer ' + getToken(),
        }
    })
    .then(response => response.json())
    .then(data => {
        const tbody = document.getElementById('projectsTableBody');
        tbody.innerHTML = '';
        
        if (data.results && data.results.length > 0) {
            data.results.forEach(project => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${project.name}</td>
                    <td>${project.category_name || 'N/A'}</td>
                    <td><span class="badge bg-info">${project.status}</span></td>
                    <td>${project.priority || 'N/A'}</td>
                    <td>${project.leader_name || 'Unassigned'}</td>
                    <td>${new Date(project.start_date).toLocaleDateString()}</td>
                    <td>${new Date(project.due_date).toLocaleDateString()}</td>
                    <td>
                        <button class="btn btn-sm btn-info" onclick="viewProject(${project.id})">View</button>
                        <button class="btn btn-sm btn-warning" onclick="editProject(${project.id})">Edit</button>
                        <button class="btn btn-sm btn-danger" onclick="deleteProject(${project.id})">Delete</button>
                    </td>
                `;
                tbody.appendChild(row);
            });
        } else {
            tbody.innerHTML = '<tr><td colspan="8" class="text-center text-muted">No projects found</td></tr>';
        }
    })
    .catch(error => {
        console.error('Error loading projects:', error);
        document.getElementById('projectsTableBody').innerHTML = '<tr><td colspan="8" class="text-center text-danger">Error loading projects</td></tr>';
    });
}

function saveProject() {
    const form = document.getElementById('projectForm');
    const formData = new FormData(form);
    
    fetch('/api/projects/', {
        method: 'POST',
        headers: {
            'Authorization': 'Bearer ' + getToken(),
            'Content-Type': 'application/json',
        },
        body: JSON.stringify(Object.fromEntries(formData))
    })
    .then(response => response.json())
    .then(data => {
        if (data.id) {
            alert('Project created successfully!');
            form.reset();
            bootstrap.Modal.getInstance(document.getElementById('createProjectModal')).hide();
            loadProjects();
        }
    })
    .catch(error => console.error('Error:', error));
}

function deleteProject(id) {
    if (confirm('Are you sure you want to delete this project?')) {
        fetch(`/api/projects/${id}/`, {
            method: 'DELETE',
            headers: {
                'Authorization': 'Bearer ' + getToken(),
            }
        })
        .then(() => {
            alert('Project deleted successfully!');
            loadProjects();
        })
        .catch(error => console.error('Error:', error));
    }
}

function viewProject(id) {
    alert('View project ' + id + ' - Feature coming soon');
}

function editProject(id) {
    alert('Edit project ' + id + ' - Feature coming soon');
}

function getToken() {
    // Get CSRF token or auth token
    return document.querySelector('meta[name="csrf-token"]')?.content || '';
}
</script>

{% endblock %}
